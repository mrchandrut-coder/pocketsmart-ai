<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">PocketSmart AI data flow</title><desc id="desc">Credentials and planner inputs flow from the user through browser validation and FastAPI. Gemini or the offline planner generates recommendations, SQLite saves them per user, and the app returns results and history.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#526981"/></marker></defs><rect width="1200" height="680" fill="#f4f7fb"/><text x="44" y="54" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#173b64">Data Flow Diagram</text><text x="44" y="82" font-family="Segoe UI,Arial" font-size="15" fill="#61758d">PocketSmart AI | account, planning, and history flows</text>
<rect x="42" y="250" width="140" height="94" rx="12" fill="#173b64"/><text x="86" y="291" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#fff">User</text><text x="58" y="319" font-family="Segoe UI,Arial" font-size="12" fill="#dce8f5">credentials + inputs</text>
<rect x="225" y="230" width="180" height="132" rx="12" fill="#fff" stroke="#9bb2cc" stroke-width="2"/><text x="258" y="268" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#173b64">Browser UI</text><text x="250" y="296" font-family="Segoe UI,Arial" font-size="13" fill="#526981">form validation</text><text x="250" y="321" font-family="Segoe UI,Arial" font-size="13" fill="#526981">same-site cookie</text><text x="250" y="345" font-family="Segoe UI,Arial" font-size="13" fill="#526981">JSON / image data</text>
<rect x="452" y="216" width="210" height="160" rx="12" fill="#1e6fd9"/><text x="487" y="255" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#fff">FastAPI router</text><text x="479" y="285" font-family="Segoe UI,Arial" font-size="13" fill="#e8f2ff">authenticate account</text><text x="479" y="311" font-family="Segoe UI,Arial" font-size="13" fill="#e8f2ff">validate bounded input</text><text x="479" y="337" font-family="Segoe UI,Arial" font-size="13" fill="#e8f2ff">select planner</text><text x="479" y="361" font-family="Segoe UI,Arial" font-size="12" fill="#d1e4ff">validate image if supplied</text>
<path d="M182 296h35M405 296h39" stroke="#526981" stroke-width="3" marker-end="url(#a)"/>
<rect x="712" y="132" width="194" height="104" rx="12" fill="#fff5df" stroke="#dfbf79" stroke-width="2"/><text x="753" y="170" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#7a5312">Gemini</text><text x="736" y="199" font-family="Segoe UI,Arial" font-size="12" fill="#705d3c">configured provider</text><text x="736" y="220" font-family="Segoe UI,Arial" font-size="12" fill="#705d3c">validated JSON response</text>
<rect x="712" y="284" width="194" height="104" rx="12" fill="#edf8f2" stroke="#8fc3a0" stroke-width="2"/><text x="740" y="323" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#28603e">Offline planner</text><text x="736" y="351" font-family="Segoe UI,Arial" font-size="12" fill="#456852">category rules + allocation</text><text x="736" y="373" font-family="Segoe UI,Arial" font-size="12" fill="#456852">fallback if unavailable</text>
<path d="M662 254h36v-70h6M662 337h36v-1h6" fill="none" stroke="#526981" stroke-width="3" marker-end="url(#a)"/>
<rect x="970" y="205" width="185" height="125" rx="12" fill="#277447"/><text x="1024" y="249" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#fff">SQLite</text><text x="992" y="277" font-family="Segoe UI,Arial" font-size="12" fill="#e1f3e7">user + password hash</text><text x="992" y="301" font-family="Segoe UI,Arial" font-size="12" fill="#e1f3e7">owned plan + timestamp</text><path d="M906 183h40v62h16M906 336h40v-65h16" fill="none" stroke="#526981" stroke-width="3" marker-end="url(#a)"/>
<rect x="410" y="475" width="438" height="104" rx="12" fill="#fff" stroke="#9bb2cc" stroke-width="2"/><text x="455" y="516" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#173b64">Response to browser</text><text x="455" y="546" font-family="Segoe UI,Arial" font-size="13" fill="#526981">plan JSON · source · dashboard totals · history view</text><path d="M1060 330v196H858" fill="none" stroke="#526981" stroke-width="3" marker-end="url(#a)"/><path d="M410 527h-94v-153" fill="none" stroke="#526981" stroke-width="3" marker-end="url(#a)"/>
