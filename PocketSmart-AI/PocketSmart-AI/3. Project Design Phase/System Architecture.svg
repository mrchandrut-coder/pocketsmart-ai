<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">PocketSmart AI system architecture</title><desc id="desc">Browser interface connects to FastAPI routers. SQLite stores accounts and per-user recommendations. Gemini is optional and an offline recommendation service is the fallback.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526981"/></marker></defs>
<rect width="1200" height="720" fill="#f4f7fb"/><text x="48" y="54" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#173b64">PocketSmart AI | System Architecture</text><text x="48" y="84" font-family="Segoe UI,Arial" font-size="15" fill="#61758d">Authenticated budget planners with persistent history and optional AI provider</text>
<rect x="48" y="145" width="240" height="410" rx="12" fill="#fff" stroke="#bdcce0" stroke-width="2"/><rect x="48" y="145" width="240" height="48" rx="12" fill="#173b64"/><text x="72" y="177" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#fff">Browser</text><text x="72" y="235" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#173b64">Jinja pages</text><text x="72" y="263" font-family="Segoe UI,Arial" font-size="14" fill="#526981">Landing, auth, dashboard</text><text x="72" y="286" font-family="Segoe UI,Arial" font-size="14" fill="#526981">Home, party, jewelry</text><text x="72" y="333" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#173b64">Session</text><text x="72" y="361" font-family="Segoe UI,Arial" font-size="14" fill="#526981">HttpOnly cookie or bearer</text><text x="72" y="413" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#173b64">Static files</text><text x="72" y="441" font-family="Segoe UI,Arial" font-size="14" fill="#526981">CSS and page scripts</text>
<rect x="356" y="122" width="480" height="468" rx="12" fill="#fff" stroke="#9bb2cc" stroke-width="2"/><rect x="356" y="122" width="480" height="52" rx="12" fill="#1e6fd9"/><text x="382" y="156" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#fff">FastAPI application</text>
<rect x="382" y="196" width="428" height="72" rx="8" fill="#edf4fc" stroke="#c7d8ea"/><text x="402" y="226" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#173b64">Application routes</text><text x="402" y="250" font-family="Segoe UI,Arial" font-size="13" fill="#526981">Pages, startup status, history API</text>
<rect x="382" y="284" width="202" height="92" rx="8" fill="#edf4fc" stroke="#c7d8ea"/><text x="400" y="315" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#173b64">Auth router</text><text x="400" y="341" font-family="Segoe UI,Arial" font-size="13" fill="#526981">bcrypt + JWT</text><text x="400" y="360" font-family="Segoe UI,Arial" font-size="13" fill="#526981">Register / login / logout</text>
<rect x="604" y="284" width="206" height="92" rx="8" fill="#edf4fc" stroke="#c7d8ea"/><text x="622" y="315" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#173b64">Feature routers</text><text x="622" y="341" font-family="Segoe UI,Arial" font-size="13" fill="#526981">Home / Party / Jewelry</text><text x="622" y="360" font-family="Segoe UI,Arial" font-size="13" fill="#526981">Validated + user scoped</text>
