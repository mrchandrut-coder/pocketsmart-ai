<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">PocketSmart login screen design</title><desc id="desc">Sign-in form on the left and planner summary on the right.</desc>
<rect width="1440" height="900" fill="#f7f9fc"/><rect width="690" height="900" fill="#fff"/><path d="M690 0v900" stroke="#d9e2ee" stroke-width="2"/><rect x="690" width="750" height="900" fill="#102c4c"/><path d="M1090 0h350v900h-160z" fill="#1e6fd9" opacity=".32"/><text x="104" y="128" font-family="Segoe UI,Arial" font-size="15" fill="#61758d">← Back to home</text><text x="104" y="202" font-family="Segoe UI,Arial" font-size="27" font-weight="700" fill="#173b64">PocketSmart<tspan fill="#1e6fd9">.</tspan><tspan fill="#edae32">AI</tspan></text><text x="104" y="266" font-family="Segoe UI,Arial" font-size="34" font-weight="700" fill="#102c4c">Welcome back</text><text x="104" y="300" font-family="Segoe UI,Arial" font-size="16" fill="#61758d">Sign in to open your saved plans and planners.</text>
