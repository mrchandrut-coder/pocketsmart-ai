<text x="795" y="286" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#ffd37c">YOUR PLANNING WORKSPACE</text><text x="795" y="344" font-family="Segoe UI,Arial" font-size="35" font-weight="700" fill="#fff">One account.</text><text x="795" y="389" font-family="Segoe UI,Arial" font-size="35" font-weight="700" fill="#fff">Three clear plans.</text><text x="795" y="435" font-family="Segoe UI,Arial" font-size="16" fill="#dce8f5">Recommendations stay linked to your account.</text><rect x="795" y="490" width="448" height="68" rx="9" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".22"/><text x="820" y="531" font-family="Segoe UI,Arial" font-size="15" fill="#fff">Home interior budgets</text><rect x="795" y="574" width="448" height="68" rx="9" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".22"/><text x="820" y="615" font-family="Segoe UI,Arial" font-size="15" fill="#fff">Party costs and allocations</text><rect x="795" y="658" width="448" height="68" rx="9" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".22"/><text x="820" y="699" font-family="Segoe UI,Arial" font-size="15" fill="#fff">Jewelry and outfit styling</text></svg>